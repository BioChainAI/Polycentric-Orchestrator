[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "biochain-polycentric-orchestrator"
version = "0.1.0"
description = "BioChain AI provisional interoperable scaffold; not production certified"
requires-python = ">=3.10"
dependencies = ["biochain-shdccp-core>=0.1,<1","biochain-manifold-projection>=0.1,<1"]

[tool.setuptools.packages.find]
where = ["src"]
